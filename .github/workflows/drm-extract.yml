name: iOS JSC DRM Extract

on:
  workflow_dispatch:
    inputs:
      ios_version:
        description: 'iOS version hint (unused, kept for compat)'
        required: false
        default: 'latest'
  push:
    branches: [ main ]

jobs:
  # ── Job 1: Playwright WebKit smoke-test ─────────────────────────────────────
  webkit-arm64:
    name: Playwright WebKit (ARM64 macOS)
    runs-on: macos-latest
    timeout-minutes: 15
    outputs:
      xn_set:   ${{ steps.check.outputs.xn_set }}
      e5_value: ${{ steps.check.outputs.e5_value }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright WebKit
        run: npx playwright install webkit --with-deps

      - name: Run DRM extraction (Playwright WebKit)
        id: run_pw
        run: node playwright_webkit_wasm.js --ci
        continue-on-error: true
        env:
          CI: true

      - name: Check output
        id: check
        run: |
          if [ -f output/result.json ]; then
            XN=$(python3 -c "import json; d=json.load(open('output/result.json')); print(d.get('xn_set','false'))")
            E5=$(python3 -c "import json; d=json.load(open('output/result.json')); print(d.get('e5_value','unknown'))")
            echo "xn_set=$XN"   >> "$GITHUB_OUTPUT"
            echo "e5_value=$E5" >> "$GITHUB_OUTPUT"
            echo "XN_SET=$XN  E5=$E5"
          else
            echo "xn_set=false"    >> "$GITHUB_OUTPUT"
            echo "e5_value=unknown" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Playwright results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-webkit-arm64
          path: output/
          retention-days: 7

  # ── Job 2: iOS Simulator — real iOS JSC ────────────────────────────────────
  #
  # Uses a proper iOS App target (not bare XCTest) so WKWebView's networking
  # process can start. Built with xcodeproj gem + xcodebuild, installed on
  # simulator and launched via xcrun simctl.
  ios-simulator:
    name: iOS Simulator (real iOS JSC)
    runs-on: macos-latest
    timeout-minutes: 25
    needs: webkit-arm64
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: List available simulators
        run: xcrun simctl list devices available | grep -E "iPhone 1[5-9]|iPhone 17|iPhone Air" | head -5

      - name: Get simulator UDID
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys,re
          data=json.load(sys.stdin)
          best=None; bv=(0,0)
          for rt,devs in data['devices'].items():
              m=re.search(r'(\d+)-(\d+)',rt)
              if not m: continue
              ver=(int(m.group(1)),int(m.group(2)))
              for d in devs:
                  if d.get('isAvailable') and 'iPhone 16' in d['name'] and 'SE' not in d['name']:
                      if ver>bv: bv=ver; best=d['udid']
          if not best:
              for rt,devs in data['devices'].items():
                  for d in devs:
                      if d.get('isAvailable') and 'iPhone' in d['name'] and 'SE' not in d['name']:
                          best=d['udid']; break
                  if best: break
          print(best or '')
          ")
          echo "UDID=$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Start patching HTTP server
        run: |
          GOOLL="$GITHUB_WORKSPACE/参考/1DECX7UIQIB1Z/gooll"
          python3 "$GITHUB_WORKSPACE/.github/scripts/patch_server.py" "$GOOLL" 8765 &
          echo "HTTP_PID=$!" >> "$GITHUB_ENV"
          sleep 2
          curl -sf http://127.0.0.1:8765/gooll.html > /dev/null \
            && echo "[CI] HTTP server OK" \
            || echo "[CI] WARNING: server check failed"

      - name: Install xcodeproj gem
        run: gem install xcodeproj --quiet 2>/dev/null || true

      - name: Generate Xcode project
        run: |
          ruby "$GITHUB_WORKSPACE/.github/scripts/gen_xcode_app.rb" \
            "$GITHUB_WORKSPACE/.github/scripts/ios_extract_app" \
            "$RUNNER_TEMP/iOSExtract"

      - name: Build iOS app for simulator
        run: |
          cd "$RUNNER_TEMP/iOSExtract"
          echo "=== Available schemes ==="
          xcodebuild -list 2>&1 | head -10 || true

          xcodebuild build \
            -project iOSExtract.xcodeproj \
            -scheme iOSExtract \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tail -20

      - name: Install and launch app on simulator
        run: |
          mkdir -p output
          SIM_UDID="${{ steps.sim.outputs.udid }}"

          # Boot simulator if needed
          xcrun simctl boot "$SIM_UDID" 2>/dev/null || true
          sleep 5

          # Find built .app
          APP_PATH=$(find "$RUNNER_TEMP/build" -name "iOSExtract.app" -type d | head -1)
          echo "App path: $APP_PATH"
          [ -z "$APP_PATH" ] && echo "ERROR: app not found" && exit 1

          # Install
          xcrun simctl install "$SIM_UDID" "$APP_PATH"
          echo "[CI] App installed"

          # Stream simulator logs to file (background)
          xcrun simctl spawn "$SIM_UDID" log stream \
            --predicate 'processImagePath contains "iOSExtract"' \
            2>/dev/null > /tmp/sim_log.txt &
          LOG_PID=$!
          sleep 2

          # Launch app
          xcrun simctl launch "$SIM_UDID" com.test.iosextract
          echo "[CI] App launched, waiting 160s for JSC exploit..."
          sleep 160

          # Stop log capture
          kill $LOG_PID 2>/dev/null || true

          echo "=== Simulator log (tail 50) ==="
          tail -50 /tmp/sim_log.txt || true
          cp /tmp/sim_log.txt output/sim_log.txt 2>/dev/null || true

          # Try to get the results file
          xcrun simctl spawn "$SIM_UDID" \
            cat /tmp/ios_jsc_results.txt > output/ios_jsc_results.txt 2>/dev/null || true
          echo "[CI] Done"
        continue-on-error: true

      - name: Parse results
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/parse_results.py"

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-results
          path: output/
          retention-days: 7
