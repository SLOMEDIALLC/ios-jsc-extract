name: iOS JSC DRM Extract

on:
  workflow_dispatch:
    inputs:
      ios_version:
        description: 'iOS version hint (unused, kept for compat)'
        required: false
        default: 'latest'
  push:
    branches: [ main ]

jobs:
  # ── Job 1: Playwright WebKit smoke-test ─────────────────────────────────────
  webkit-arm64:
    name: Playwright WebKit (ARM64 macOS)
    runs-on: macos-latest
    timeout-minutes: 15
    outputs:
      xn_set:   ${{ steps.check.outputs.xn_set }}
      e5_value: ${{ steps.check.outputs.e5_value }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright WebKit
        run: npx playwright install webkit --with-deps

      - name: Run DRM extraction (Playwright WebKit)
        id: run_pw
        run: node playwright_webkit_wasm.js --ci
        continue-on-error: true
        env:
          CI: true

      - name: Check output
        id: check
        run: |
          if [ -f output/result.json ]; then
            XN=$(python3 -c "import json; d=json.load(open('output/result.json')); print(d.get('xn_set','false'))")
            E5=$(python3 -c "import json; d=json.load(open('output/result.json')); print(d.get('e5_value','unknown'))")
            echo "xn_set=$XN"   >> "$GITHUB_OUTPUT"
            echo "e5_value=$E5" >> "$GITHUB_OUTPUT"
          else
            echo "xn_set=false"    >> "$GITHUB_OUTPUT"
            echo "e5_value=unknown" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Playwright results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-webkit-arm64
          path: output/
          retention-days: 7

  # ── Job 2: BrowserStack 真实 iPhone — 真正的 iOS JSC ──────────────────────
  #
  # 关键：真实 iOS 设备使用真实 iOS JSC（不是 macOS JSC）
  # pm exploit (Worker + ct()) 的 JSC 内存偏移量在真实 iPhone 上是正确的
  # 不需要 Worker bypass，让完整 exploit 自然运行
  browserstack-real-device:
    name: BrowserStack Real iPhone (iOS JSC)
    runs-on: macos-latest
    timeout-minutes: 30
    needs: webkit-arm64
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Get simulator UDID (for build only)
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys,re
          data=json.load(sys.stdin)
          best=None; bv=(0,0)
          for rt,devs in data['devices'].items():
              m=re.search(r'(\d+)-(\d+)',rt)
              if not m: continue
              ver=(int(m.group(1)),int(m.group(2)))
              for d in devs:
                  if d.get('isAvailable') and 'iPhone' in d['name'] and 'SE' not in d['name']:
                      if ver>bv: bv=ver; best=d['udid']
          print(best or '')
          ")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator UDID for build: $UDID"

      - name: Start patching HTTP server (real-device mode — no Worker bypass)
        run: |
          GOOLL="$GITHUB_WORKSPACE/参考/1DECX7UIQIB1Z/gooll"
          python3 "$GITHUB_WORKSPACE/.github/scripts/patch_server.py" \
            "$GOOLL" 8765 real-device &
          echo "HTTP_PID=$!" >> "$GITHUB_ENV"
          sleep 2
          curl -sf http://127.0.0.1:8765/gooll.html > /dev/null \
            && echo "[CI] HTTP server OK (real-device mode)" \
            || echo "[CI] WARNING: server check failed"

      - name: Install xcodeproj gem
        run: gem install xcodeproj --quiet 2>/dev/null || true

      - name: Generate Xcode project
        run: |
          ruby "$GITHUB_WORKSPACE/.github/scripts/gen_xcode_app.rb" \
            "$GITHUB_WORKSPACE/.github/scripts/ios_extract_app" \
            "$RUNNER_TEMP/iOSExtract"

      - name: Build iOS app for device (unsigned — BrowserStack resigns)
        run: |
          cd "$RUNNER_TEMP/iOSExtract"

          # Build for generic iOS device (iphoneos SDK, not simulator)
          xcodebuild build \
            -project iOSExtract.xcodeproj \
            -scheme iOSExtract \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 | tail -20 || true

          # Fallback: build for simulator if device build fails
          APP_PATH=$(find "$RUNNER_TEMP/build" -name "iOSExtract.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "[CI] Device build failed, trying simulator build..."
            xcodebuild build \
              -project iOSExtract.xcodeproj \
              -scheme iOSExtract \
              -sdk iphonesimulator \
              -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
              -derivedDataPath "$RUNNER_TEMP/build_sim" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              2>&1 | tail -10 || true
            APP_PATH=$(find "$RUNNER_TEMP/build_sim" -name "iOSExtract.app" -type d 2>/dev/null | head -1)
          fi

          echo "APP_PATH=$APP_PATH"
          [ -z "$APP_PATH" ] && echo "ERROR: build failed" && exit 1

          # Package as .ipa
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -r "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -r iOSExtract.ipa Payload/
          echo "[CI] IPA created: $(du -h iOSExtract.ipa | cut -f1)"

      - name: Upload IPA to BrowserStack
        id: upload
        run: |
          RESPONSE=$(curl -s -u "${{ secrets.BS_USERNAME }}:${{ secrets.BS_ACCESS_KEY }}" \
            -X POST "https://api-cloud.browserstack.com/app-automate/upload" \
            -F "file=@$RUNNER_TEMP/iOSExtract.ipa" \
            -F "custom_id=iOSExtract")
          echo "BrowserStack upload response: $RESPONSE"
          APP_URL=$(echo "$RESPONSE" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('app_url',''))" 2>/dev/null)
          echo "APP_URL=$APP_URL"
          [ -z "$APP_URL" ] && echo "ERROR: Upload failed" && exit 1
          echo "bs_app_url=$APP_URL" >> "$GITHUB_OUTPUT"

      - name: Start BrowserStack Local Tunnel
        uses: browserstack/github-actions/setup-local@v1.0.1
        with:
          local-testing: start
          local-identifier: jsc-extract
        env:
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BS_ACCESS_KEY }}

      - name: Install Appium client
        run: pip3 install Appium-Python-Client requests

      - name: Run on real iPhone via BrowserStack
        run: |
          mkdir -p output
          python3 "$GITHUB_WORKSPACE/.github/scripts/bs_run.py" \
            "${{ steps.upload.outputs.bs_app_url }}" \
            "jsc-extract" \
            2>&1 | tee output/bs_run.log
        env:
          BS_USERNAME:   ${{ secrets.BS_USERNAME }}
          BS_ACCESS_KEY: ${{ secrets.BS_ACCESS_KEY }}
        continue-on-error: true

      - name: Parse results
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/parse_results.py"

      - name: Stop BrowserStack Local Tunnel
        uses: browserstack/github-actions/setup-local@v1.0.1
        if: always()
        with:
          local-testing: stop
        env:
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BS_ACCESS_KEY }}

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-results
          path: output/
          retention-days: 7
