name: iOS JSC DRM Extract

on:
  workflow_dispatch:
    inputs:
      ios_version:
        description: 'iOS version hint (unused, kept for compat)'
        required: false
        default: 'latest'
  push:
    branches: [ main ]

jobs:
  # ── Job 1: Playwright WebKit smoke-test (non-JSC, no exploit expected) ──────
  webkit-arm64:
    name: Playwright WebKit (ARM64 macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    outputs:
      xn_set:   ${{ steps.check.outputs.xn_set }}
      e5_value: ${{ steps.check.outputs.e5_value }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright WebKit
        run: npx playwright install webkit --with-deps

      - name: Run DRM extraction (Playwright WebKit)
        id: run_pw
        run: node playwright_webkit_wasm.js --ci
        continue-on-error: true
        env:
          CI: true

      - name: Check output
        id: check
        run: |
          if [ -f output/result.json ]; then
            XN=$(python3 -c "import json,sys; d=json.load(open('output/result.json')); print(d.get('xn_set','false'))")
            E5=$(python3 -c "import json,sys; d=json.load(open('output/result.json')); print(d.get('e5_value','unknown'))")
            echo "xn_set=$XN"   >> "$GITHUB_OUTPUT"
            echo "e5_value=$E5" >> "$GITHUB_OUTPUT"
            echo "XN_SET=$XN  E5=$E5"
          else
            echo "xn_set=false"   >> "$GITHUB_OUTPUT"
            echo "e5_value=unknown" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Playwright results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-webkit-arm64
          path: |
            output/
            参考解密完整/wasm/webkit/
          retention-days: 7

  # ── Job 2: macOS WKWebView — real Apple JSC, no Simulator sandbox issues ────
  #
  # Why macOS instead of iOS Simulator:
  #   The bare XCTest approach (no host app) cannot start WebKit's networking
  #   process in the iOS Simulator → WKWebView stays stuck at about:blank.
  #   macOS WKWebView runs directly on the GitHub runner with full JSC JIT
  #   (DFG + FTL), which is the same JSC engine as iOS Safari.
  #
  # Patch fix:
  #   The OLD patch removed if(e[5]!==6.6), so the code ran immediately with
  #   wrong constant keys (ws=0xDEAD etc.) — garbage decryption.
  #   The NEW patch keeps the condition: JSC JIT must fire type-confusion to
  #   overwrite e[5], then the block runs with real leaked heap-pointer keys.
  macos-wkwebview:
    name: macOS WKWebView (real JSC ARM64)
    runs-on: macos-latest
    timeout-minutes: 30
    needs: webkit-arm64
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Start patching HTTP server
        run: |
          GOOLL="$GITHUB_WORKSPACE/参考/1DECX7UIQIB1Z/gooll"
          python3 "$GITHUB_WORKSPACE/.github/scripts/patch_server.py" "$GOOLL" 8765 &
          echo "HTTP_PID=$!" >> "$GITHUB_ENV"
          sleep 2
          curl -sf http://127.0.0.1:8765/gooll.html > /dev/null \
            && echo "[CI] HTTP server OK" \
            || echo "[CI] WARNING: server check failed (may still work)"

      - name: Compile macOS WKWebView extractor
        run: |
          swiftc \
            -framework WebKit \
            -framework AppKit \
            -framework Foundation \
            "$GITHUB_WORKSPACE/.github/scripts/wkextract.swift" \
            -o /tmp/wkextract
          echo "[CI] Compiled wkextract OK"

      - name: Run extractor (real JSC — waits for JIT exploit to fire)
        run: |
          mkdir -p output
          # 160s hard timeout (extractor self-limits to 150s)
          timeout 160 /tmp/wkextract 2>&1 \
            | tee output/macos_wk_full.log \
            | grep -E "\[JS\]|\[NAV\]|\[STATUS\]|\[MACWK\]|XN SET|JSC-FIRE|DECRYPTED_JS_URL|JSC ERR|XHR" \
            || true

          cp /tmp/ios_jsc_results.txt output/ 2>/dev/null || echo "(no results file — extractor may have timed out)"
        continue-on-error: true

      - name: Parse results
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/parse_results.py"

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-results
          path: output/
          retention-days: 7
