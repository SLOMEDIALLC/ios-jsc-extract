name: Fetch Weifile Assets

on:
  workflow_dispatch:

jobs:
  fetch:
    name: Fetch with Playwright WebKit
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install webkit --with-deps

      - name: Run fetch script
        run: node fetch_weifile.js

      - name: Upload captured files
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weifile-captured
          path: output/
          retention-days: 7
