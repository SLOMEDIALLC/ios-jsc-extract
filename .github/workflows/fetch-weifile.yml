name: Fetch Weifile Assets
on:
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install playwright && npx playwright install chromium --with-deps
      - run: node fetch_weifile.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weifile-captured
          path: output/
          retention-days: 7
